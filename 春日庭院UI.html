<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>春日庭院 · 最终原型</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700;900&display=swap" rel="stylesheet" />
    <style>
        /* ============================================================
           CSS 变量 · 12套主题系统
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* ----- 默认：Graphite ----- */
        :root {
            /* 基础色 */
            --bg-base: #F8F6F3;
            --bg-surface: rgba(255, 255, 255, 0.5);
            --bg-card: rgba(255, 255, 255, 0.6);
            --bg-glass: rgba(255, 255, 255, 0.4);
            --text-primary: #1A1715;
            --text-secondary: #5A5550;
            --text-muted: rgba(0, 0, 0, 0.25);
            --border-subtle: rgba(0, 0, 0, 0.08);

            /* 主色 & 强调色 */
            --theme-hue: 16;
            --theme-sat: 75%;
            --theme-light: 55%;
            --theme-color: #E8743C;
            --theme-color-rgb: 232, 116, 60;
            --theme-glow: rgba(232, 116, 60, 0.12);
            --theme-bg-subtle: rgba(232, 116, 60, 0.06);

            /* 强调色2（辅助） */
            --accent-secondary: #2D2A24;

            /* 字体 */
            --font-family: 'Noto Sans SC', 'Inter', -apple-system, sans-serif;
            --font-size-base: 15px;
        }

        /* ----- 预设主题定义 ----- */
        [data-theme="graphite"] {
            --bg-base: #F8F6F3;
            --bg-surface: rgba(255, 255, 255, 0.5);
            --bg-card: rgba(255, 255, 255, 0.6);
            --text-primary: #1A1715;
            --text-secondary: #5A5550;
            --text-muted: rgba(0, 0, 0, 0.25);
            --border-subtle: rgba(0, 0, 0, 0.08);
            --theme-color: #E8743C;
            --theme-color-rgb: 232, 116, 60;
            --theme-glow: rgba(232, 116, 60, 0.12);
            --theme-bg-subtle: rgba(232, 116, 60, 0.06);
            --accent-secondary: #2D2A24;
            --bg-glass: rgba(255, 255, 255, 0.4);
        }

        [data-theme="aurora"] {
            --bg-base: #F5F0F8;
            --bg-surface: rgba(255, 255, 255, 0.45);
            --bg-card: rgba(255, 255, 255, 0.55);
            --text-primary: #3A2F4A;
            --text-secondary: #6A5F7A;
            --text-muted: rgba(60, 40, 80, 0.25);
            --border-subtle: rgba(90, 70, 120, 0.10);
            --theme-color: #5BC0BE;
            --theme-color-rgb: 91, 192, 190;
            --theme-glow: rgba(91, 192, 190, 0.12);
            --theme-bg-subtle: rgba(91, 192, 190, 0.06);
            --accent-secondary: #4A3F5C;
            --bg-glass: rgba(255, 255, 255, 0.35);
        }

        [data-theme="slate"] {
            --bg-base: #EDEEF0;
            --bg-surface: rgba(255, 255, 255, 0.5);
            --bg-card: rgba(255, 255, 255, 0.6);
            --text-primary: #1A2A3A;
            --text-secondary: #4A5A6A;
            --text-muted: rgba(30, 50, 70, 0.25);
            --border-subtle: rgba(0, 0, 0, 0.08);
            --theme-color: #4A90D9;
            --theme-color-rgb: 74, 144, 217;
            --theme-glow: rgba(74, 144, 217, 0.12);
            --theme-bg-subtle: rgba(74, 144, 217, 0.06);
            --accent-secondary: #2C3E50;
            --bg-glass: rgba(255, 255, 255, 0.4);
        }

        [data-theme="carbon"] {
            --bg-base: #1A1715;
            --bg-surface: rgba(255, 255, 255, 0.04);
            --bg-card: rgba(255, 255, 255, 0.06);
            --text-primary: #EDE8E0;
            --text-secondary: #A09888;
            --text-muted: rgba(255, 255, 255, 0.25);
            --border-subtle: rgba(255, 255, 255, 0.06);
            --theme-color: #6CC4A1;
            --theme-color-rgb: 108, 196, 161;
            --theme-glow: rgba(108, 196, 161, 0.12);
            --theme-bg-subtle: rgba(108, 196, 161, 0.06);
            --accent-secondary: #C4BDB5;
            --bg-glass: rgba(255, 255, 255, 0.03);
        }

        [data-theme="nocturne"] {
            --bg-base: #14101A;
            --bg-surface: rgba(255, 255, 255, 0.04);
            --bg-card: rgba(255, 255, 255, 0.06);
            --text-primary: #EDE8F0;
            --text-secondary: #A098B0;
            --text-muted: rgba(255, 255, 255, 0.25);
            --border-subtle: rgba(255, 255, 255, 0.06);
            --theme-color: #C9A8D4;
            --theme-color-rgb: 201, 168, 212;
            --theme-glow: rgba(201, 168, 212, 0.12);
            --theme-bg-subtle: rgba(201, 168, 212, 0.06);
            --accent-secondary: #E8E0F0;
            --bg-glass: rgba(255, 255, 255, 0.03);
        }

        [data-theme="amber"] {
            --bg-base: #1A120E;
            --bg-surface: rgba(255, 255, 255, 0.04);
            --bg-card: rgba(255, 255, 255, 0.06);
            --text-primary: #EDE0D0;
            --text-secondary: #A09080;
            --text-muted: rgba(255, 255, 255, 0.25);
            --border-subtle: rgba(255, 255, 255, 0.06);
            --theme-color: #F5A97F;
            --theme-color-rgb: 245, 169, 127;
            --theme-glow: rgba(245, 169, 127, 0.15);
            --theme-bg-subtle: rgba(245, 169, 127, 0.06);
            --accent-secondary: #E8C97A;
            --bg-glass: rgba(255, 255, 255, 0.03);
        }

        [data-theme="wisteria"] {
            --bg-base: #100E1A;
            --bg-surface: rgba(255, 255, 255, 0.04);
            --bg-card: rgba(255, 255, 255, 0.06);
            --text-primary: #EDE8F5;
            --text-secondary: #A098B8;
            --text-muted: rgba(255, 255, 255, 0.25);
            --border-subtle: rgba(255, 255, 255, 0.06);
            --theme-color: #B8A6D9;
            --theme-color-rgb: 184, 166, 217;
            --theme-glow: rgba(184, 166, 217, 0.15);
            --theme-bg-subtle: rgba(184, 166, 217, 0.06);
            --accent-secondary: #E8D5F0;
            --bg-glass: rgba(255, 255, 255, 0.03);
        }

        [data-theme="sakura"] {
            --bg-base: #FDF5F7;
            --bg-surface: rgba(255, 255, 255, 0.5);
            --bg-card: rgba(255, 255, 255, 0.6);
            --text-primary: #3A2A30;
            --text-secondary: #7A5A6A;
            --text-muted: rgba(60, 30, 40, 0.20);
            --border-subtle: rgba(200, 150, 170, 0.15);
            --theme-color: #E8A0BF;
            --theme-color-rgb: 232, 160, 191;
            --theme-glow: rgba(232, 160, 191, 0.12);
            --theme-bg-subtle: rgba(232, 160, 191, 0.06);
            --accent-secondary: #D4C5C9;
            --bg-glass: rgba(255, 255, 255, 0.35);
        }

        [data-theme="mint"] {
            --bg-base: #F0F5F2;
            --bg-surface: rgba(255, 255, 255, 0.5);
            --bg-card: rgba(255, 255, 255, 0.6);
            --text-primary: #1A2A22;
            --text-secondary: #4A6A5A;
            --text-muted: rgba(30, 60, 40, 0.20);
            --border-subtle: rgba(100, 180, 150, 0.15);
            --theme-color: #7EC8B0;
            --theme-color-rgb: 126, 200, 176;
            --theme-glow: rgba(126, 200, 176, 0.12);
            --theme-bg-subtle: rgba(126, 200, 176, 0.06);
            --accent-secondary: #3A7A5A;
            --bg-glass: rgba(255, 255, 255, 0.35);
        }

        [data-theme="ocean"] {
            --bg-base: #0A0F14;
            --bg-surface: rgba(255, 255, 255, 0.04);
            --bg-card: rgba(255, 255, 255, 0.06);
            --text-primary: #E8EEF5;
            --text-secondary: #8898A8;
            --text-muted: rgba(255, 255, 255, 0.25);
            --border-subtle: rgba(255, 255, 255, 0.06);
            --theme-color: #6B9EC4;
            --theme-color-rgb: 107, 158, 196;
            --theme-glow: rgba(107, 158, 196, 0.12);
            --theme-bg-subtle: rgba(107, 158, 196, 0.06);
            --accent-secondary: #A8D8EA;
            --bg-glass: rgba(255, 255, 255, 0.03);
        }

        [data-theme="dusk"] {
            --bg-base: #1A0F0F;
            --bg-surface: rgba(255, 255, 255, 0.04);
            --bg-card: rgba(255, 255, 255, 0.06);
            --text-primary: #EDD8D0;
            --text-secondary: #A08880;
            --text-muted: rgba(255, 255, 255, 0.25);
            --border-subtle: rgba(255, 255, 255, 0.06);
            --theme-color: #C06C6C;
            --theme-color-rgb: 192, 108, 108;
            --theme-glow: rgba(192, 108, 108, 0.12);
            --theme-bg-subtle: rgba(192, 108, 108, 0.06);
            --accent-secondary: #E8C97A;
            --bg-glass: rgba(255, 255, 255, 0.03);
        }

        [data-theme="stardust"] {
            --bg-base: #0A0A14;
            --bg-surface: rgba(255, 255, 255, 0.04);
            --bg-card: rgba(255, 255, 255, 0.06);
            --text-primary: #E8E8F0;
            --text-secondary: #9898B0;
            --text-muted: rgba(255, 255, 255, 0.25);
            --border-subtle: rgba(255, 255, 255, 0.06);
            --theme-color: #8B8BC0;
            --theme-color-rgb: 139, 139, 192;
            --theme-glow: rgba(139, 139, 192, 0.12);
            --theme-bg-subtle: rgba(139, 139, 192, 0.06);
            --accent-secondary: #C8C8E8;
            --bg-glass: rgba(255, 255, 255, 0.03);
        }

        /* ----- 全局基础样式 ----- */
        html,
        body {
            height: 100%;
            font-family: var(--font-family);
            font-size: var(--font-size-base);
            background: var(--bg-base);
            color: var(--text-primary);
            transition: background 0.5s ease, color 0.5s ease;
            overflow: hidden;
        }

        /* ============================================================
           粒子背景 Canvas
           ============================================================ */
        #particleCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* ============================================================
           覆盖层（启动界面 / 主菜单）
           ============================================================ */
        .overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: var(--bg-base);
            transition: opacity 0.8s ease, transform 0.8s ease, background 0.5s ease;
            pointer-events: all;
        }
        .overlay.hidden {
            opacity: 0;
            transform: scale(1.03);
            pointer-events: none;
        }

        .overlay::before {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, var(--theme-glow), transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            filter: blur(60px);
            transition: background 0.8s ease;
            pointer-events: none;
        }

        .overlay .content {
            position: relative;
            z-index: 2;
            text-align: center;
            animation: fadeUp 1.2s ease both;
        }

        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(30px) scale(0.96);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .overlay .title {
            font-size: 56px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--theme-color), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 8px;
            transition: background 0.6s ease;
            text-shadow: none;
            filter: drop-shadow(0 4px 30px var(--theme-glow));
        }
        .overlay .subtitle {
            font-size: 16px;
            color: var(--text-secondary);
            letter-spacing: 10px;
            font-weight: 300;
            margin-top: 4px;
            margin-bottom: 40px;
            transition: color 0.5s ease;
        }
        .overlay .menu {
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-width: 200px;
        }
        .overlay .menu button {
            padding: 14px 44px;
            border-radius: 40px;
            border: 1px solid var(--border-subtle);
            background: var(--bg-card);
            color: var(--text-primary);
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            letter-spacing: 2px;
            backdrop-filter: blur(12px);
        }
        .overlay .menu button:hover {
            background: var(--theme-bg-subtle);
            border-color: var(--theme-color);
            transform: scale(1.03);
            box-shadow: 0 0 40px var(--theme-glow);
        }
        .overlay .menu button.primary {
            background: var(--theme-color);
            color: #fff;
            border-color: var(--theme-color);
        }
        .overlay .menu button.primary:hover {
            opacity: 0.88;
            box-shadow: 0 0 50px var(--theme-glow);
        }

        .overlay .version {
            position: absolute;
            bottom: 28px;
            font-size: 12px;
            color: var(--text-muted);
            letter-spacing: 2px;
            z-index: 2;
            transition: color 0.5s ease;
        }

        /* ============================================================
           主应用
           ============================================================ */
        .app {
            display: none;
            width: 100vw;
            height: 100vh;
            background: var(--bg-base);
            overflow: hidden;
            flex-direction: column;
            position: relative;
            z-index: 1;
            transition: background 0.5s ease;
        }
        .app.visible {
            display: flex;
        }

        /* ===== 导航 ===== */
        .nav {
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-subtle);
            flex-shrink: 0;
            background: var(--bg-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            z-index: 10;
            min-height: 52px;
            transition: background 0.5s ease, border-color 0.5s ease;
        }
        .nav .brand {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 2px;
            color: var(--text-secondary);
            transition: color 0.5s ease;
        }
        .nav .brand span {
            color: var(--theme-color);
            transition: color 0.5s ease;
        }
        .nav .actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .nav .actions button {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 17px;
            cursor: pointer;
            padding: 4px 10px;
            border-radius: 8px;
            transition: all 0.2s;
            line-height: 1;
        }
        .nav .actions button:hover {
            background: var(--bg-surface);
            color: var(--text-primary);
        }

        .nav .role-switch {
            display: flex;
            gap: 4px;
            background: var(--bg-surface);
            border-radius: 20px;
            padding: 3px;
            border: 1px solid var(--border-subtle);
            transition: background 0.5s ease, border-color 0.5s ease;
        }
        .nav .role-switch button {
            padding: 4px 14px;
            border-radius: 16px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            font-weight: 500;
        }
        .nav .role-switch button.active {
            background: var(--theme-color);
            color: #fff;
            box-shadow: 0 0 20px var(--theme-glow);
        }
        .nav .role-switch button:hover:not(.active) {
            color: var(--text-primary);
        }

        /* ===== 主布局 ===== */
        .main-layout {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* ===== 聊天区 ===== */
        .chat-area {
            flex: 7;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 14px 18px 8px 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .chat-messages::-webkit-scrollbar {
            width: 3px;
        }
        .chat-messages::-webkit-scrollbar-thumb {
            background: var(--border-subtle);
            border-radius: 8px;
        }

        .msg {
            display: flex;
            flex-direction: column;
            max-width: 80%;
            animation: msgSlide 0.35s ease both;
        }
        .msg.ai {
            align-self: flex-start;
        }
        .msg.user {
            align-self: flex-end;
            align-items: flex-end;
        }
        .msg .meta {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 3px;
            padding-left: 4px;
            transition: color 0.5s ease;
        }
        .msg .meta .avatar {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            border: 1.5px solid var(--border-subtle);
        }
        .msg .meta .avatar.ling {
            border-color: #F5A97F;
            background: rgba(245, 169, 127, 0.15);
        }
        .msg .meta .avatar.nai {
            border-color: #B8A6D9;
            background: rgba(184, 166, 217, 0.15);
        }
        .msg .meta .avatar.user {
            border-color: var(--border-subtle);
            background: var(--bg-surface);
        }
        .msg .bubble {
            padding: 10px 16px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.7;
            word-break: break-word;
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            transition: background 0.5s ease, border-color 0.5s ease;
        }
        .msg.ai .bubble {
            border-top-left-radius: 4px;
        }
        .msg.ai.ling .bubble {
            border-left: 3px solid #F5A97F;
            background: rgba(245, 169, 127, 0.06);
        }
        .msg.ai.nai .bubble {
            border-left: 3px solid #B8A6D9;
            background: rgba(184, 166, 217, 0.06);
        }
        .msg.user .bubble {
            border-top-right-radius: 4px;
            color: var(--text-secondary);
        }
        .msg .bubble .cursor-blink {
            display: inline-block;
            width: 2px;
            height: 1em;
            background: var(--theme-color);
            margin-left: 2px;
            vertical-align: text-bottom;
            animation: blink 0.9s infinite;
        }
        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0;
            }
        }
        @keyframes msgSlide {
            0% {
                opacity: 0;
                transform: translateY(10px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 输入区 */
        .chat-input-area {
            padding: 10px 18px 14px 18px;
            border-top: 1px solid var(--border-subtle);
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: var(--bg-glass);
            backdrop-filter: blur(12px);
            transition: background 0.5s ease, border-color 0.5s ease;
        }
        .chat-input-area .input-row {
            display: flex;
            gap: 10px;
        }
        .chat-input-area input {
            flex: 1;
            padding: 10px 18px;
            border-radius: 40px;
            border: 1px solid var(--border-subtle);
            background: var(--bg-surface);
            color: var(--text-primary);
            font-size: 14px;
            outline: none;
            transition: all 0.4s ease;
            font-family: inherit;
        }
        .chat-input-area input::placeholder {
            color: var(--text-secondary);
            font-weight: 300;
        }
        .chat-input-area input:focus {
            border-color: var(--theme-color);
            box-shadow: 0 0 0 4px rgba(var(--theme-color-rgb), 0.08);
        }
        .chat-input-area input:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .chat-input-area .send-btn {
            padding: 0 24px;
            border-radius: 40px;
            border: none;
            background: var(--theme-color);
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            opacity: 0.92;
        }
        .chat-input-area .send-btn:hover {
            opacity: 1;
            transform: scale(1.02);
        }
        .chat-input-area .send-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            transform: none;
        }

        .action-bar {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }
        .action-bar button {
            padding: 3px 12px;
            border-radius: 30px;
            border: 1px solid var(--border-subtle);
            background: var(--bg-surface);
            color: var(--text-secondary);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.25s ease;
            font-family: inherit;
        }
        .action-bar button:hover {
            background: var(--theme-bg-subtle);
            border-color: var(--theme-color);
            color: var(--text-primary);
        }

        /* ===== 状态面板 ===== */
        .sidebar {
            flex: 3;
            min-width: 190px;
            max-width: 300px;
            background: var(--bg-glass);
            backdrop-filter: blur(16px);
            border-left: 1px solid var(--border-subtle);
            padding: 14px 14px 10px 14px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: background 0.5s ease, border-color 0.5s ease;
        }
        .sidebar::-webkit-scrollbar {
            width: 2px;
        }
        .sidebar::-webkit-scrollbar-thumb {
            background: var(--border-subtle);
            border-radius: 8px;
        }

        .s-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: 16px;
            padding: 12px 14px;
            transition: all 0.4s ease;
            backdrop-filter: blur(4px);

        /* ============================================================
           外观设置面板（弹窗）

</head>
<body>

    <!-- ============================================================

    <script>
        // ============================================================
        // 1. 粒子背景
        // ============================================================
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let w, h;

        function resizeCanvas() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * w;
                this.y = Math.random() * h;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = (Math.random() - 0.5) * 0.3;
                this.speedY = (Math.random() - 0.5) * 0.3;
                this.opacity = Math.random() * 0.4 + 0.1;
                this.pulse = Math.random() * Math.PI * 2;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.pulse += 0.01;
                if (this.x < 0 || this.x > w) this.speedX *= -1;
                if (this.y < 0 || this.y > h) this.speedY *= -1;
            }
            draw() {
                const alpha = this.opacity * (0.7 + 0.3 * Math.sin(this.pulse));
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255,255,255,${alpha})`;
                ctx.fill();
            }
        }

        for (let i = 0; i < 80; i++) particles.push(new Particle());

        function animateParticles() {
            ctx.clearRect(0, 0, w, h);
            for (const p of particles) {
                p.update();
                p.draw();
            }
            requestAnimationFrame(animateParticles);
        }
        animateParticles();

        // ============================================================
        // 2. 主题系统
        // ============================================================
        const THEMES = [

        // ============================================================
        // 3. 可读性检测 (WCAG)
        // ============================================================
        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : { r: 0, g: 0, b: 0 };
        }

        function luminance(r, g, b) {
            const [rs, gs, bs] = [r, g, b].map(c => {
                c = c / 255;
                return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
            });
            return 0.2126 * rs + 0.7152 * gs + 0.0722 * bs;
        }

        function contrastRatio(hex1, hex2) {
            const rgb1 = hexToRgb(hex1);
            const rgb2 = hexToRgb(hex2);
            const l1 = luminance(rgb1.r, rgb1.g, rgb1.b);
            const l2 = luminance(rgb2.r, rgb2.g, rgb2.b);
            const lighter = Math.max(l1, l2);
            const darker = Math.min(l1, l2);
            return (lighter + 0.05) / (darker + 0.05);
        }

        function isDark(hex) {
            const rgb = hexToRgb(hex);
            return luminance(rgb.r, rgb.g, rgb.b) < 0.4;
        }

        function getBgColor() {
            const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg-base').trim();
            return bg || '#1A120E';
        }

        function getTextColor() {
            const text = getComputedStyle(document.documentElement).getPropertyValue('--text-primary').trim();
            return text || '#EDE8E0';
        }

        function recommendThemes() {
            const bg = getBgColor();
            const bgIsDark = isDark(bg);
            const candidates = THEMES.filter(t => isDark(t.bg) === bgIsDark);
            const scored = candidates.map(t => {
                const textColor = bgIsDark ? '#EDE8E0' : '#1A1715';
                const ratio = contrastRatio(t.bg, textColor);
                return { ...t, ratio };
            });
            scored.sort((a, b) => b.ratio - a.ratio);
            return scored.slice(0, 4);
        }

        function checkReadability() {
            const bg = getBgColor();
            const text = getTextColor();
            const ratio = contrastRatio(bg, text);
            const alert = document.getElementById('readabilityAlert');

            let level, icon, msg, recommendations = [];
            if (ratio >= 7) {
                level = 'good';
                icon = '✅';
                msg = `对比度 ${ratio.toFixed(1)}:1 · AAA 级 · 极佳`;
            } else if (ratio >= 4.5) {
                level = 'good';
                icon = '✅';
                msg = `对比度 ${ratio.toFixed(1)}:1 · AA 级 · 良好`;
            } else if (ratio >= 3) {
                level = 'warning';
                icon = '⚠️';
                msg = `对比度 ${ratio.toFixed(1)}:1 · 建议调整`;
                recommendations = recommendThemes();
            } else {
                level = 'danger';
                icon = '❌';
                msg = `对比度 ${ratio.toFixed(1)}:1 · 可读性不足！`;
                recommendations = recommendThemes();
            }

            let recHTML = '';
            if (recommendations.length > 0) {
                recHTML = `
                    <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;width:100%;">
                        <span style="font-size:12px;color:var(--text-muted);margin-right:4px;">推荐切换：</span>
                        ${recommendations.map(t => `
                            <button class="rec-theme-btn" data-theme="${t.id}" style="
                                padding:2px 14px;
                                border-radius:16px;
                                border:1px solid var(--border-subtle);
                                background:${t.bg};
                                color:${isDark(t.bg) ? '#EDE8E0' : '#1A1715'};
                                font-size:11px;
                                cursor:pointer;
                                font-family:inherit;
                                transition:all 0.2s;
                            ">${t.name}</button>
                        `).join('')}
                    </div>
                `;
            }

            alert.className = `readability-alert ${level}`;
            alert.innerHTML = `
                <span class="icon">${icon}</span>
                <span>${msg}</span>
                ${level !== 'good' ? `<button class="action-btn" id="autoFixBtn">智能优化</button>` : ''}
                ${recHTML}
            `;

            document.querySelectorAll('.rec-theme-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    applyTheme(this.dataset.theme);
                    setTimeout(checkReadability, 200);
                });
            });

            const fixBtn = document.getElementById('autoFixBtn');
            if (fixBtn) {
                fixBtn.addEventListener('click', () => {
                    const recs = recommendThemes();
                    if (recs.length > 0) {
                        applyTheme(recs[0].id);
                        setTimeout(checkReadability, 200);
                    } else {
                        const bg = getBgColor();
                        if (isDark(bg)) {
                            const rgb = hexToRgb(bg);
                            const newBg = `#${[rgb.r, rgb.g, rgb.b].map(c => Math.min(255, c + 50).toString(16).padStart(2,'0')).join('')}`;
                            document.documentElement.style.setProperty('--bg-base', newBg);
                            document.documentElement.style.setProperty('--text-primary', '#1A1715');
                            document.documentElement.style.setProperty('--text-secondary', '#5A5550');
                        } else {
                            const rgb = hexToRgb(bg);
                            const newBg = `#${[rgb.r, rgb.g, rgb.b].map(c => Math.max(0, c - 50).toString(16).padStart(2,'0')).join('')}`;
                            document.documentElement.style.setProperty('--bg-base', newBg);
                            document.documentElement.style.setProperty('--text-primary', '#EDE8E0');
                            document.documentElement.style.setProperty('--text-secondary', '#A09888');
                        }
                        setTimeout(checkReadability, 200);
                    }
                });
            }
        }

            document.documentElement.style.setProperty('--theme-color', primary);
            document.documentElement.style.setProperty('--theme-color-rgb', `${rgb.r}, ${rgb.g}, ${rgb.b}`);
            document.documentElement.style.setProperty('--accent-secondary', accent);
            document.documentElement.style.setProperty('--theme-glow', `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, 0.12)`);
            document.documentElement.style.setProperty('--theme-bg-subtle', `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, 0.06)`);
            const bgLum = luminance(rgb.r, rgb.g, rgb.b);
            if (bgLum < 0.3) {
                document.documentElement.style.setProperty('--text-primary', '#EDE8E0');
                document.documentElement.style.setProperty('--text-secondary', '#A09888');
            } else {
                document.documentElement.style.setProperty('--text-primary', '#1A1715');
                document.documentElement.style.setProperty('--text-secondary', '#5A5550');

        function addMessage(text, sender, roleId) {
            const container = document.getElementById('chatMessages');
            const wrapper = document.createElement('div');

            const meta = document.createElement('div');

            if (sender === 'user') {
                meta.innerHTML = `<span class="avatar user">👤</span><span>主人</span>`;
            } else {
                const role = roleData[roleId];
                meta.innerHTML = `<span class="avatar ${roleId}">${role.icon}</span><span>${role.name}</span>`;
            }
            wrapper.appendChild(meta);

            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            if (sender === 'ai') {
                bubble.innerHTML = `<span class="typing-text"></span><span class="cursor-blink"></span>`;
            } else {
                bubble.textContent = text;
            }
            wrapper.appendChild(bubble);
            container.appendChild(wrapper);
            container.scrollTop = container.scrollHeight;

            if (sender === 'ai') {
                const textSpan = bubble.querySelector('.typing-text');
                const cursor = bubble.querySelector('.cursor-blink');
                let i = 0;
                const speed = 25;

                function type() {
                    if (i < text.length) {
                        textSpan.textContent += text.charAt(i);
                        i++;
                        container.scrollTop = container.scrollHeight;
                        setTimeout(type, speed);
                    } else {
                        if (cursor) cursor.remove();
                    }
                }
                type();
            }
        }

            renderSidebar();

            const role = state.currentRole;
            const replies = {
                hug: role === 'ling' ? '喵…被抱着的感觉…还不错。' : '嗯～主人的怀抱好暖…',
                kiss: role === 'ling' ? '（尾巴微微颤了一下）…你突然干什么喵…' : '（耳朵刷地红了）主人…雪奈还没准备好…',
                eat: role === 'ling' ? '（小口小口地吃）…哼，还算用心。' : '好吃！主人的手艺最棒了！',
                drink: role === 'ling' ? '（喝完舔了舔嘴角）…谢了喵。' : '咕噜咕噜…啊～活过来了！',
                sleep: role === 'ling' ? '（蜷成一团）嗯…那眯一会儿…' : '（乖乖躺下）主人可以摸摸雪奈的头吗…',
                sex: role === 'ling' ? '（喘息着）主人…慢点…喵…' : '（耳根通红）主人…雪奈…好奇怪…'
            };
            setTimeout(() => addMessage(replies[action] || '喵～', 'ai', role), 300);
        }

        // ============================================================
        // 8. UI 控制
        // ============================================================
        function updateRoleUI() {
            document.querySelectorAll('#roleSwitch button').forEach(el => {
                el.classList.toggle('active', el.dataset.role === state.currentRole);
            });
            renderSidebar();
        }

        function toggleSettings(open) {
            document.getElementById('settingsOverlay').classList.toggle('open', open);
            if (open) {
                renderThemeGrid();
                checkReadability();
            }
        }

        // ============================================================
        // 9. 事件绑定
        // ============================================================
        document.getElementById('startGameBtn').addEventListener('click', () => {
            document.getElementById('overlay').classList.add('hidden');
            document.getElementById('app').classList.add('visible');
            renderSidebar();
            setTimeout(() => {
                addMessage('喵～你来了。我在窗台上晒了好一会儿太阳了。', 'ai', 'ling');
                setTimeout(() => {
                    state.currentRole = 'nai';
                    updateRoleUI();
                    addMessage('嗯～小玲姐姐！主人来了怎么不叫我！', 'ai', 'nai');
                    setTimeout(() => {
                        state.currentRole = 'ling';
                        updateRoleUI();
                        addMessage('喵……你急什么，主人又不会跑。', 'ai', 'ling');
                    }, 800);
                }, 1000);
            }, 400);
            document.getElementById('chatInput').focus();
        });

        document.getElementById('openSettingsFromMenu').addEventListener('click', () => toggleSettings(true));
        document.getElementById('openSettingsBtn').addEventListener('click', () => toggleSettings(true));
        document.getElementById('closeSettingsBtn').addEventListener('click', () => toggleSettings(false));
        document.getElementById('settingsOverlay').addEventListener('click', (e) => {
            if (e.target === e.currentTarget) toggleSettings(false);
        });

        document.getElementById('menuBackBtn').addEventListener('click', () => {
            if (confirm('确定返回主菜单吗？进度会保留。')) {
                document.getElementById('app').classList.remove('visible');
                document.getElementById('overlay').classList.remove('hidden');
            }
        });

        document.querySelectorAll('#roleSwitch button').forEach(btn => {
            btn.addEventListener('click', function() {
                const role = this.dataset.role;
                if (role === state.currentRole) return;
                state.currentRole = role;
                updateRoleUI();
                const name = roleData[role].name;
                addMessage(`（你轻轻唤了一声“${name}”，她抬起头看向你。）`, 'user');
                setTimeout(() => {
                    addMessage(role === 'ling' ? '喵？你叫我了？' : '嗯？主人！雪奈在！', 'ai', role);
                }, 400);
            });
        });

        function handleSend() {
            const input = document.getElementById('chatInput');
            const text = input.value.trim();
            if (!text || state.isTyping) return;
            addMessage(text, 'user');
            input.value = '';
            simulateReply(text);
        }
        document.getElementById('sendBtn').addEventListener('click', handleSend);
        document.getElementById('chatInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleSend();
        });

        document.getElementById('actionBar').addEventListener('click', (e) => {
            const btn = e.target.closest('button');
            if (!btn) return;
            applyAction(btn.dataset.action);
        });

        document.getElementById('applyCustomBtn').addEventListener('click', applyCustomColors);

        document.querySelectorAll('#sizeGroup button').forEach(btn => {
            btn.addEventListener('click', function() {
                setFontSize(parseInt(this.dataset.size));
            });
        });

        document.querySelectorAll('#fontGroup button').forEach(btn => {
            btn.addEventListener('click', function() {
                setFontFamily(this.dataset.font);
            });
        });

        // ============================================================
        // 10. 初始化
        // ============================================================
        applyTheme('amber');
        renderThemeGrid();

        console.log('🌸 春日庭院 · 最终原型已加载');
        console.log('🎨 12套主题 + 自定义颜色 + 可读性预警 + 背景粒子');
        console.log('💡 点击 🎨 打开外观设置面板');
    </script>
</body>
</html>
