[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "spring-haven-companion-core"
version = "0.1.0"
description = "Independent local companion runtime for Spring Haven"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.9,<4", "pypdf>=5,<7"]

[project.scripts]
spring-haven-core = "spring_haven_core.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
